services:
  db:
    container_name: airline-postgres
    image: postgres:14.22-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airline-db
      PGDATA: /data/postgres
    volumes:
      - airline-db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  airline-db: